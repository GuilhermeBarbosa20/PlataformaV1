# ================================================
# LinkedIn Content Platform - Docker Compose
# Production deployment configuration
# ================================================

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkedin-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Supabase
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      # Base URL
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Google Cloud (choose ONE method)
      # Method 1: Base64 encoded credentials (RECOMMENDED)
      - GOOGLE_CREDENTIALS_BASE64=${GOOGLE_CREDENTIALS_BASE64}
      # Method 2: Individual variables
      # - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      # - GOOGLE_CLIENT_EMAIL=${GOOGLE_CLIENT_EMAIL}
      # - GOOGLE_PRIVATE_KEY_ID=${GOOGLE_PRIVATE_KEY_ID}
      # - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # Vertex AI
      - VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - VERTEX_IMAGE_MODEL=${VERTEX_IMAGE_MODEL:-gemini-2.5-flash-image}
      # Apify
      - APIFY_TOKEN=${APIFY_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - linkedin-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Nginx reverse proxy for SSL termination
  nginx:
    image: nginx:alpine
    container_name: linkedin-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - linkedin-network
    profiles:
      - with-nginx

networks:
  linkedin-network:
    driver: bridge

# Usage:
# 
# 1. Basic deployment (app only):
#    docker-compose up -d app
#
# 2. With Nginx reverse proxy:
#    docker-compose --profile with-nginx up -d
#
# 3. View logs:
#    docker-compose logs -f app
#
# 4. Rebuild after code changes:
#    docker-compose build --no-cache app && docker-compose up -d app
